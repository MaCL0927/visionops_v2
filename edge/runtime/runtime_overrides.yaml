version: 2.3.3
camera:
  # Legacy Python RTSP/USB camera path disabled.
  # Use C++ settings: HP60C C++ SDK 相机 -> http://127.0.0.1:18181/stream.mjpeg
  type: disabled
  common:
    preview_width: 960
    jpeg_quality: 100
vision_box:
  device_id: rk3588-001
  customer_id: CUST-001
  default_mode: factory
  collector_port: 8090
  production_port: 8082
  validation_port: 8082
  models_dir: /opt/visionops/models
  data_dir: /opt/visionops/edge/collector/data
  log_keep_days: 7
  usb_auto_mount: true
  disk_warn_percent: 80
  time_sync:
    mode: upper_host_ntp
    ntp_server: 192.168.1.100
    fallback_ntp: ntp.ubuntu.com
    client: chrony
  network:
    eth0:
      role: camera_lan
      dhcp: false
      ip: 192.168.2.10
      netmask: 255.255.255.0
      gateway: ''
    eth1:
      role: factory_lan
      dhcp: true
      ip: 192.168.1.200
      netmask: 255.255.255.0
      gateway: 192.168.1.1
  upload:
    enabled: true
    host: 192.168.1.100
    user: pc
    port: 22
    target_dir: /home/pc/桌面/visionops_v2/data/incoming
    timeout_sec: 120
algorithm:
  common:
    model_mode: manual
    input_size: 640x640
    npu_core: auto
    realtime_interval_ms: 1000
    production_fps_limit: 1
    production_detect_interval_ms: 1000
    warmup_runs: 3
    label_display: class_conf
    max_results: 100
    log_level: INFO
  classification:
    topk: 5
    score_threshold: 0.5
    low_confidence_policy: review
  detection:
    conf_threshold: 0.25
    nms_threshold: 0.45
    show_center: true
    max_detections: 100
  obb_detection:
    conf_threshold: 0.25
    nms_threshold: 0.45
    nms_mode: horizontal
    show_angle: true
    show_polygon: true
  segmentation:
    conf_threshold: 0.25
    nms_threshold: 0.45
    mask_threshold: 0.5
    mask_alpha: 0.35
    show_mask: true
    show_box: true
    show_mode: mask_only
